<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <!-- Navy background circle -->
    <radialGradient id="bgRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#243B55"/>
      <stop offset="100%" stop-color="#0F1E32"/>
    </radialGradient>

    <!-- Sweep gradient: coral → rose → plum -->
    <linearGradient id="sweepColor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA935A"/>
      <stop offset="45%" stop-color="#D6456E"/>
      <stop offset="100%" stop-color="#481D4A"/>
    </linearGradient>

    <!-- Soft glow for center hub -->
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FA935A" stop-opacity="1"/>
      <stop offset="60%" stop-color="#D6456E" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#481D4A" stop-opacity="0"/>
    </radialGradient>

    <!-- Clip path for the circular boundary -->
    <clipPath id="circleClip">
      <circle cx="160" cy="160" r="148"/>
    </clipPath>
  </defs>

  <!-- Outer background circle -->
  <circle cx="160" cy="160" r="160" fill="#0F1E32"/>

  <!-- Deep navy main disc -->
  <circle cx="160" cy="160" r="148" fill="url(#bgRadial)"/>

  <!-- === FINE TICK MARKS AROUND THE OUTER RING === -->
  <g stroke="#E2E8F0" stroke-linecap="round">
    <!-- Cardinal ticks (longer) -->
    <line x1="160" y1="16" x2="160" y2="28" stroke-width="2.5" opacity="0.7"/>    <!-- N -->
    <line x1="304" y1="160" x2="292" y2="160" stroke-width="2.5" opacity="0.7"/>  <!-- E -->
    <line x1="160" y1="304" x2="160" y2="292" stroke-width="2.5" opacity="0.7"/>  <!-- S -->
    <line x1="16" y1="160" x2="28" y2="160" stroke-width="2.5" opacity="0.7"/>    <!-- W -->

    <!-- Ordinal ticks (medium) -->
    <line x1="262" y1="58" x2="254" y2="66" stroke-width="2" opacity="0.5" transform="rotate(0 160 160)"/>
    <line x1="262" y1="262" x2="254" y2="254" stroke-width="2" opacity="0.5"/>
    <line x1="58" y1="262" x2="66" y2="254" stroke-width="2" opacity="0.5"/>
    <line x1="58" y1="58" x2="66" y2="66" stroke-width="2" opacity="0.5"/>

    <!-- Minor ticks every 15 degrees -->
    <g opacity="0.3" stroke-width="1.2">
      <!-- 15° intervals, done as short lines at radius ~144 to 148 -->
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(15 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(30 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(60 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(75 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(105 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(120 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(150 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(165 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(195 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(210 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(240 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(255 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(285 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(300 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(330 160 160)"/>
      <line x1="160" y1="18" x2="160" y2="26" transform="rotate(345 160 160)"/>
    </g>
  </g>

  <!-- Cardinal letters -->
  <text x="160" y="50" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#E2E8F0" opacity="0.7">N</text>
  <text x="274" y="165" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#E2E8F0" opacity="0.7">E</text>
  <text x="160" y="282" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#E2E8F0" opacity="0.7">S</text>
  <text x="46" y="165" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="14" font-weight="700" fill="#E2E8F0" opacity="0.7">W</text>

  <!-- === OUTER RING STROKE === -->
  <circle cx="160" cy="160" r="148" fill="none" stroke="#2A4A6E" stroke-width="2.5"/>

  <!-- === CONCENTRIC RANGE RINGS (dashed) === -->
  <circle cx="160" cy="160" r="116" fill="none" stroke="#2A4A6E" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.6"/>
  <circle cx="160" cy="160" r="84" fill="none" stroke="#2A4A6E" stroke-width="1" stroke-dasharray="4 8" opacity="0.45"/>
  <circle cx="160" cy="160" r="52" fill="none" stroke="#2A4A6E" stroke-width="1" stroke-dasharray="3 8" opacity="0.35"/>

  <!-- === CROSSHAIR LINES (fine) === -->
  <line x1="12" y1="160" x2="308" y2="160" stroke="#2A4A6E" stroke-width="1" opacity="0.35"/>
  <line x1="160" y1="12" x2="160" y2="308" stroke="#2A4A6E" stroke-width="1" opacity="0.35"/>
  <line x1="57" y1="57" x2="263" y2="263" stroke="#2A4A6E" stroke-width="0.8" opacity="0.2"/>
  <line x1="263" y1="57" x2="57" y2="263" stroke="#2A4A6E" stroke-width="0.8" opacity="0.2"/>

  <!-- === RADAR SWEEP WEDGE (coral → plum) === -->
  <!-- The sweep beam from center outward at ~50° -->
  <!-- Wedge fill (semi-transparent) -->
  <path d="M 160 160 L 248 68 A 148 148 0 0 0 160 12 Z" fill="url(#sweepColor)" opacity="0.12" clip-path="url(#circleClip)"/>
  <!-- Wedge left edge (the sweep line) -->
  <line x1="160" y1="160" x2="247" y2="69" stroke="url(#sweepColor)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
  <!-- Sweep ring segment highlight -->
  <path d="M 195 44 A 148 148 0 0 0 247 69" fill="none" stroke="#FA935A" stroke-width="4" stroke-linecap="round" opacity="0.55"/>

  <!-- === NEEDLE === -->
  <!-- Needle body (plum at base, coral at tip) -->
  <line x1="160" y1="160" x2="247" y2="68" stroke="url(#sweepColor)" stroke-width="3" stroke-linecap="round" opacity="0.95"/>
  <!-- Needle tip dot -->
  <circle cx="247" cy="68" r="5" fill="#FA935A" opacity="0.9"/>
  <!-- Needle base back-stub -->
  <line x1="160" y1="160" x2="130" y2="194" stroke="#481D4A" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- === CENTER HUB === -->
  <circle cx="160" cy="160" r="18" fill="#0F1E32"/>
  <circle cx="160" cy="160" r="18" fill="none" stroke="#2A4A6E" stroke-width="2"/>
  <!-- Hub glow ring -->
  <circle cx="160" cy="160" r="10" fill="url(#hubGlow)" opacity="0.9"/>
  <!-- Hub inner dot -->
  <circle cx="160" cy="160" r="5" fill="#FA935A"/>

  <!-- === SIGNAL DOTS (blip echoes on rings) === -->
  <!-- On outer ring at ~30° -->
  <circle cx="234" cy="86" r="4.5" fill="#FA935A" opacity="0.7"/>
  <!-- On mid ring at ~120° -->
  <circle cx="102" cy="102" r="3.5" fill="#D6456E" opacity="0.55"/>
  <!-- On inner ring at ~200° -->
  <circle cx="128" cy="208" r="3" fill="#481D4A" opacity="0.5"/>
  <!-- Small echo at ~290° mid ring -->
  <circle cx="195" cy="232" r="2.5" fill="#D6456E" opacity="0.4"/>
</svg>
